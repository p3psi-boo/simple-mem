name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Go Edge Client and run Go unit tests
        run: |
          CGO_ENABLED=0 go build -ldflags="-s -w" -o ./bin/simple-mem ./cmd/simple-mem
          go test -count=1 ./...
      - name: Install Python Hub dependencies and run pytest (unit + E2E)
        run: |
          python -m pip install -e ".[dev]"
          pytest -q
